<!DOCTYPE html>
<html>
<head>
  <title>Bitwise Operators in JavaScript</title>
</head>
<body>
  <h2>Bitwise Operators Demo</h2>
  <p id="output"></p>

  <script>
    let x = 5;   
    let y = 3;   
    let result = "";
    result += "x & y : " + (x & y) + "<br>"; 
    result += "x | y : " + (x | y) + "<br>"; 
    result += "x ^ y : " + (x ^ y) + "<br>";    
    result += "~x : " + (~x) + "<br>";         
    result += "x << 1 : " + (x << 1) + "<br>"; 
    result += "x >> 1 : " + (x >> 1) + "<br>"; 
    result += "x >>> 1 : " + (x >>> 1) + "<br>"; 
    document.getElementById("output").innerHTML = result;
  </script>
</body>
</html>
