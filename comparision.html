<!DOCTYPE html>
<html>
<head>
  <title>Comparison Operators in JavaScript</title>
</head>
<body>
  <h2>Comparison Operators Demo</h2>
  <p id="output"></p>

  <script>
    let a = 10;
    let b = 20;
    let c = "10";
    let result = "";
    result += "a == c : " + (a == c) + "<br>";
    result += "a === c : " + (a === c) + "<br>";
    result += "a != b : " + (a != b) + "<br>";
    result += "a !== c : " + (a !== c) + "<br>";
    result += "b > a : " + (b > a) + "<br>";
    result += "a < b : " + (a < b) + "<br>";
    result += "a >= 10 : " + (a >= 10) + "<br>";
    result += "b <= 20 : " + (b <= 20) + "<br>";

    document.getElementById("output").innerHTML = result;
  </script>
</body>
</html>
