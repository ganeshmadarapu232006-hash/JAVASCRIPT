<!DOCTYPE html>
<html>
<head>
  <title>Logical Operators in JavaScript</title>
</head>
<body>
  <h2>Logical Operators Demo</h2>
  <p id="output"></p>

  <script>
    let a = true;
    let b = false;

    let result = "";

    result += "a && b : " + (a && b) + "<br>"; 
    result += "a || b : " + (a || b) + "<br>";   
    result += "!a : " + (!a) + "<br>";           
    result += "!b : " + (!b) + "<br>";           
    let x = 10;
    let y = 20;
    result += "(x > 5 && y > 15) : " + (x > 5 && y > 15) + "<br>";
    result += "(x < 5 || y > 15) : " + (x < 5 || y > 15) + "<br>";
    document.getElementById("output").innerHTML = result;
  </script>
</body>
</html>
